[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "momo"
version = "0.1.0"
description = "Point-in-time momentum back-testing framework for Indian mid-, small- and micro-cap equities (NSE)."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24", "pandas>=2.1", "scipy>=1.10", "statsmodels>=0.14", "scikit-learn>=1.3",
  "pyarrow>=14", "PyYAML>=6.0", "requests>=2.31", "tqdm>=4.66", "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.25", "jupyter>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
