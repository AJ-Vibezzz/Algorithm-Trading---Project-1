# Window convention (as this pipeline reads it - src/momo/signals.py, _window):
# lookback_months = months from the decision date back to the START of the window,
# skip_months = months from the decision date back to its END. So "12-1"
# momentum (returns of months t-12..t-2, decided at the end of t-1) = lookback 12, skip 1.

source:
  citation: "Sehgal, S. & Balakrishnan, I. (2002). Contrarian and momentum strategies in the Indian capital market. Vikalpa: The Journal for Decision Makers, 27(1), 13-20."
  doi: "10.1177/0256090920020103"
  family: cross-sectional price momentum (Indian evidence)
  market: "India - listed stocks"   # [verify sample construction]
  sample_in_paper: "1989-1999"
  long_short_in_paper: true
  headline_finding: >
    The first major Indian test: strong short-horizon continuation (momentum)
    and only weak long-horizon reversal, the latter appearing only when a year is
    skipped between formation and holding.
  pipeline_fit: full   # plain return momentum
  pipeline_notes: >
    Mainly cited as early evidence that momentum exists in India - part of your
    economic rationale. Sample predates NSE's dominance and modern settlement, so
    say why it is still relevant if you lean on it.

